<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#1b2a4a" />
  <title>Weather — Boca Raton</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg" id="bg">
    <div class="blob blob-a"></div>
    <div class="blob blob-b"></div>
    <div class="blob blob-c"></div>
  </div>

  <div class="app">
    <header class="search-wrap">
      <div class="search-bar glass">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="11" cy="11" r="6.5"></circle>
          <line x1="20" y1="20" x2="15.8" y2="15.8"></line>
        </svg>
        <input id="searchInput" type="text" placeholder="Search for a city" autocomplete="off" />
        <button id="locateBtn" class="icon-btn" title="Use current location" aria-label="Use current location">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="2.6"></circle>
            <path d="M12 2.5v3.2M12 18.3v3.2M2.5 12h3.2M18.3 12h3.2"></path>
          </svg>
        </button>
      </div>
      <ul id="searchResults" class="search-results glass hidden"></ul>
    </header>

    <main class="content">
      <section class="current glass-card">
        <div class="location-row">
          <h1 class="location-name" id="locationName">Boca Raton</h1>
          <p class="location-sub" id="locationSub">Florida, United States</p>
        </div>
        <div class="current-icon" id="currentIcon"></div>
        <div class="current-temp" id="currentTemp">--°</div>
        <p class="current-desc" id="currentDesc">Loading…</p>
        <p class="current-range" id="currentRange">H: --°&nbsp;&nbsp;L: --°</p>

        <div class="unit-toggle glass" id="unitToggle">
          <button class="unit-btn active" data-unit="f">°F</button>
          <button class="unit-btn" data-unit="c">°C</button>
        </div>
      </section>

      <section class="details-grid">
        <div class="detail-card glass-card">
          <span class="detail-label">Feels Like</span>
          <span class="detail-value" id="feelsLike">--°</span>
        </div>
        <div class="detail-card glass-card">
          <span class="detail-label">Humidity</span>
          <span class="detail-value" id="humidity">--%</span>
        </div>
        <div class="detail-card glass-card">
          <span class="detail-label">Wind</span>
          <span class="detail-value" id="wind">-- mph</span>
        </div>
        <div class="detail-card glass-card">
          <span class="detail-label">Precipitation</span>
          <span class="detail-value" id="precip">--%</span>
        </div>
      </section>

      <section class="panel glass-card">
        <h2 class="panel-title">Hourly Forecast</h2>
        <div class="hourly-scroll" id="hourlyScroll"></div>
      </section>

      <section class="panel glass-card">
        <h2 class="panel-title">7-Day Forecast</h2>
        <div class="daily-list" id="dailyList"></div>
      </section>

      <footer class="footer">
        <span>Weather data by Open-Meteo</span>
      </footer>
    </main>
  </div>

  <div class="loading-overlay hidden" id="loadingOverlay">
    <div class="spinner"></div>
  </div>

  <script src="js/app.js"></script>
</body>
</html>
